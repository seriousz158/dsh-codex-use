name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate bundle package contents
        run: |
          npm pack --dry-run --workspace packages/dsh-codex-appserver 2>&1 | tee /tmp/dsh-codex-pack.txt
          grep -Fq 'cordis.patch.yml' /tmp/dsh-codex-pack.txt
          grep -Fq 'lib/index.js' /tmp/dsh-codex-pack.txt
